<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=320,height=480">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LugaFlix — Movies Translated in Luganda</title>
<script type="text/javascript">var clickTag = "https://lugaflix.store";</script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;}
*{box-sizing:border-box;}
a.ad{display:flex;position:relative;width:100%;height:100%;text-decoration:none;cursor:pointer;
  background:linear-gradient(135deg,#0D0D1A 0%,#1a1a2e 55%,#232355 100%);overflow:hidden;}
.glow{position:absolute;width:75vmin;height:75vmin;right:-25vmin;bottom:-30vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,123,0,.30) 0%,rgba(255,123,0,0) 70%);pointer-events:none;}
.glow2{position:absolute;width:55vmin;height:55vmin;left:-20vmin;top:-22vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(183,28,28,.28) 0%,rgba(183,28,28,0) 70%);pointer-events:none;}
.logo{color:#fff;font-weight:800;letter-spacing:-.5px;line-height:1;}
.logo b{color:#FF7B00;font-weight:800;}
.badge{display:inline-block;border:1px solid rgba(255,123,0,.6);color:#FF7B00;border-radius:999px;
  padding:.4em 1em;font-weight:700;letter-spacing:.13em;text-transform:uppercase;line-height:1;}
.head{color:#fff;font-weight:800;line-height:1.22;}
.head b{color:#FF7B00;font-weight:800;}
.sub{color:rgba(255,255,255,.62);font-weight:600;line-height:1.3;}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  background:linear-gradient(180deg,#FF8C1A,#FF7B00);color:#160800;font-weight:800;
  border-radius:999px;padding:.65em 1.5em;line-height:1;box-shadow:0 .6vmin 3vmin rgba(255,123,0,.45);
  animation:pulse 3.4s ease-in-out 8;}
.tiles{display:grid;gap:1.4vmin;width:100%;}
.tile{position:relative;border-radius:1.6vmin;overflow:hidden;aspect-ratio:16/10;}
.tile .bar{position:absolute;left:8%;bottom:9%;width:55%;height:8%;border-radius:99px;background:rgba(255,255,255,.28);}
.t1{background:linear-gradient(135deg,#FF7B00,#B71C1C);}
.t2{background:linear-gradient(135deg,#23234a,#3a2f6b);}
.t3{background:linear-gradient(135deg,#B71C1C,#5a0f14);}
.t4{background:linear-gradient(135deg,#2c3e66,#16213e);}
.t5{background:linear-gradient(135deg,#ff9a3d,#FF7B00);}
.t6{background:linear-gradient(135deg,#1f2b4d,#0D0D1A);}
.play{border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 5vmin rgba(255,123,0,.75);}
.play i{display:block;width:0;height:0;border-style:solid;border-color:transparent;margin-left:12%;}
.play.abs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
@keyframes bigpulse{0%,100%{transform:scale(1);box-shadow:0 0 5vmin rgba(255,123,0,.75);}
  50%{transform:scale(1.07);box-shadow:0 0 8vmin rgba(255,123,0,.95);}}

.wrap{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:5vmin 6vmin;gap:3.2vmin;}
.logo{font-size:8.5vmin;} .badge{font-size:2.6vmin;} .head{font-size:7.2vmin;}
.sub{font-size:3.4vmin;} .cta{font-size:4.4vmin;} .spacer{flex:1;}
</style>
</head>
<body>
<a class="ad" href="javascript:window.open(window.clickTag); void(0);" aria-label="LugaFlix - Watch Movies Translated in Luganda">
<div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="logo">Luga<b>Flix</b></div><div><span class="badge">Translated in Luganda</span></div><div class="tiles" style="grid-template-columns:repeat(2,1fr);"><div class="tile t1"><div class="play abs" style="width:9vmin;height:9vmin;"><i style="border-width:1.9vmin 0 1.9vmin 3.1vmin;border-left-color:#B71C1C;"></i></div><span class="bar"></span></div><div class="tile t2"><span class="bar"></span></div><div class="tile t3"><span class="bar"></span></div><div class="tile t4"><span class="bar"></span></div></div><div class="head">Watch Movies <b>Translated in Luganda</b></div><div class="sub">New Titles Every Week &bull; Android &amp; iPhone</div><div class="spacer"></div><div class="cta">Download App <span>&#8250;</span></div></div>
</a>
</body>
</html>
