<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=320,height=100">
<title>LugaFlix — Movies Translated in Luganda</title>
<script type="text/javascript">var clickTag = "https://lugaflix.store";</script>
<style>
html,body{margin:0;padding:0;}
body{width:320px;height:100px;overflow:hidden;font-family:'Segoe UI',Arial,Helvetica,sans-serif;}
*{box-sizing:border-box;}
a.ad{display:block;position:relative;width:320px;height:100px;text-decoration:none;cursor:pointer;
  background:linear-gradient(135deg,#0D0D1A 0%,#1a1a2e 55%,#232355 100%);
  border:1px solid rgba(255,123,0,.28);overflow:hidden;}
.glow{position:absolute;width:70%;height:70%;right:-20%;bottom:-30%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,123,0,.28) 0%,rgba(255,123,0,0) 70%);pointer-events:none;}
.glow2{position:absolute;width:50%;height:50%;left:-15%;top:-20%;border-radius:50%;
  background:radial-gradient(circle,rgba(183,28,28,.25) 0%,rgba(183,28,28,0) 70%);pointer-events:none;}
.logo{color:#fff;font-weight:800;letter-spacing:-.5px;line-height:1;}
.logo b{color:#FF7B00;font-weight:800;}
.badge{display:inline-block;border:1px solid rgba(255,123,0,.6);color:#FF7B00;border-radius:999px;
  padding:.38em .9em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1;}
.head{color:#fff;font-weight:800;line-height:1.22;}
.head b{color:#FF7B00;font-weight:800;}
.sub{color:rgba(255,255,255,.62);font-weight:600;line-height:1.3;}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  background:linear-gradient(180deg,#FF8C1A,#FF7B00);color:#160800;font-weight:800;
  border-radius:999px;padding:.6em 1.35em;line-height:1;box-shadow:0 4px 18px rgba(255,123,0,.45);
  animation:pulse 3.4s ease-in-out 8;}
.cta span.arr{font-weight:900;}
.tiles{display:grid;gap:6px;}
.tile{position:relative;border-radius:7px;overflow:hidden;}
.tile .bar{position:absolute;left:8%;bottom:8%;width:55%;height:7%;min-height:4px;border-radius:99px;background:rgba(255,255,255,.28);}
.t1{background:linear-gradient(135deg,#FF7B00,#B71C1C);}
.t2{background:linear-gradient(135deg,#23234a,#3a2f6b);}
.t3{background:linear-gradient(135deg,#B71C1C,#5a0f14);}
.t4{background:linear-gradient(135deg,#2c3e66,#16213e);}
.t5{background:linear-gradient(135deg,#ff9a3d,#FF7B00);}
.t6{background:linear-gradient(135deg,#1f2b4d,#0D0D1A);}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(0,0,0,.35);}
.play i{display:block;width:0;height:0;border-style:solid;border-color:transparent;margin-left:14%;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

.wrap{position:relative;z-index:2;height:100%;padding:0 12px;display:flex;align-items:center;gap:10px;}
.txt{flex:1;text-align:center;}
</style>
</head>
<body>
<a class="ad" href="javascript:window.open(window.clickTag); void(0);" aria-label="LugaFlix - Watch Movies Translated in Luganda">
<div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="logo" style="font-size:18px;">Luga<b>Flix</b></div><div class="txt"><div class="head" style="font-size:13px;">Movies <b>Translated in Luganda</b></div><div class="sub" style="font-size:9px;margin-top:3px;">New Titles Every Week</div></div><div class="cta" style="font-size:11px;">Download App <span class="arr">&#8250;</span></div></div>
</a>
</body>
</html>
