<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=320,height=480">
<title>Resume Where You Stopped - LugaFlix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a0a0a;color:#fff;width:320px;height:480px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.progress-bar{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-bottom:14px;overflow:hidden}
.progress-fill{width:62%;height:100%;background:#C0392B;border-radius:3px}
h2{font-size:18px;font-weight:900;margin-bottom:6px}
p{font-size:12px;color:rgba(255,255,255,.5);line-height:1.4;max-width:230px;margin-bottom:18px}
.cta{display:inline-block;background:#C0392B;color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:9px 24px;text-decoration:none;transition:background .2s}
.cta:hover{background:#a83225}
.brand{position:absolute;top:12px;left:14px;font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.3)}
.brand span{color:#C0392B}
.time{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:4px;font-weight:700}
</style>
<script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js"></script>
</head>
<body>
<div class="brand">LUGA<span>FLIX</span></div>
<div class="progress-bar"><div class="progress-fill"></div></div>
<div class="time">1:02:34 / 1:45:00</div>
<h2>Pick Up Where You Stopped</h2>
<p>Close the app and come back later. LugaFlix remembers where you were watching.</p>
<div class="cta" onclick="ExitApi.exit('landingPage')" style="cursor:pointer">Continue Watching</div>
</body>
</html>
